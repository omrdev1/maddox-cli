name: "Maddox Drift Check"
description: "Scans a project for design-token, motion, and component-state drift against its own @theme block, and posts a PR comment"
branding:
  icon: "layers"
  color: "orange"
inputs:
  target-dir:
    description: "Directory to scan for token/motion/state usages. Required unless url is set."
    required: false
  theme-css:
    description: "Path to the CSS file containing the @theme block (ground-truth tokens)"
    required: true
  motion-tokens:
    description: "Optional path to a JSON file of motion tokens (e.g. a vendored copy of your motionTokens export)"
    required: false
  states:
    description: "Optional path to a state-contract JSON file (see README). Has no effect when url is set — state-completeness is a source-code check."
    required: false
  tokens-studio:
    description: "Optional path to a Tokens Studio / W3C Design Tokens JSON export, merged with (and taking precedence over) theme-css"
    required: false
  url:
    description: "Optional deployed page URL to scan instead of local source — fetches the page's rendered HTML plus its same-origin stylesheets. When set, target-dir is not required."
    required: false
  figma-file:
    description: "Optional Figma file key (from the file's URL) to pull color/spacing tokens from its Variables, merged with (and taking precedence over) theme-css/tokens-studio. Requires an Enterprise Figma plan and figma-token."
    required: false
  figma-token:
    description: "Personal access token or OAuth2 token for figma-file, e.g. ${{ secrets.FIGMA_TOKEN }}. Required if figma-file is set."
    required: false
  figma-token-type:
    description: "Whether figma-token is a personal access token (\"pat\", sent via X-Figma-Token) or an OAuth2 token (\"oauth\", sent via Authorization: Bearer). Defaults to pat."
    required: false
    default: "pat"
  github-token:
    description: "GitHub token for posting PR comments"
    required: true
  api-key:
    description: "Optional Maddox Engine API key to upload this scan to your dashboard at maddoxengine.com"
    required: false
  api-url:
    description: "Maddox Engine API base URL"
    required: false
    default: "https://www.maddoxengine.com"
  fail-below:
    description: "Fail the build if the drift health score (0-100) falls below this threshold. Omit to never fail the build (comment-only)."
    required: false
runs:
  using: "composite"
  steps:
    - name: Install maddox
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm install --no-save

    - name: Run Maddox scan
      id: run-scan
      shell: bash
      env:
        MADDOX_API_KEY: ${{ inputs.api-key }}
        MADDOX_API_URL: ${{ inputs.api-url }}
        MADDOX_FIGMA_TOKEN: ${{ inputs.figma-token-type == 'pat' && inputs.figma-token || '' }}
        MADDOX_FIGMA_OAUTH_TOKEN: ${{ inputs.figma-token-type == 'oauth' && inputs.figma-token || '' }}
      run: |
        MOTION_FLAG=""
        if [ -n "${{ inputs.motion-tokens }}" ]; then
          MOTION_FLAG="--motion ${{ inputs.motion-tokens }}"
        fi

        STATES_FLAG=""
        if [ -n "${{ inputs.states }}" ]; then
          STATES_FLAG="--states ${{ inputs.states }}"
        fi

        TOKENS_STUDIO_FLAG=""
        if [ -n "${{ inputs.tokens-studio }}" ]; then
          TOKENS_STUDIO_FLAG="--tokens-studio ${{ inputs.tokens-studio }}"
        fi

        URL_FLAG=""
        if [ -n "${{ inputs.url }}" ]; then
          URL_FLAG="--url ${{ inputs.url }}"
        fi

        FIGMA_FLAG=""
        if [ -n "${{ inputs.figma-file }}" ]; then
          FIGMA_FLAG="--figma-file ${{ inputs.figma-file }}"
        fi

        # target-dir is a required positional arg in the CLI's own arg
        # parsing even in --url mode (only its *value* is ignored there) —
        # pass a harmless placeholder so url-only usage doesn't also have
        # to set target-dir just to satisfy argv[2].
        TARGET_DIR="${{ inputs.target-dir }}"
        if [ -z "$TARGET_DIR" ]; then
          TARGET_DIR="-"
        fi

        # Run once, capture both the markdown report (for the PR comment)
        # and the exit code from --fail-below (if set) without letting a
        # non-zero exit kill this step — the comment must still post
        # before the build is allowed to fail, otherwise a reviewer sees
        # a red check with no explanation of what drifted.
        set +e
        npx tsx "${{ github.action_path }}/src/cli.ts" \
          "$TARGET_DIR" \
          "${{ inputs.theme-css }}" \
          $MOTION_FLAG \
          $STATES_FLAG \
          $TOKENS_STUDIO_FLAG \
          $URL_FLAG \
          $FIGMA_FLAG \
          --format markdown \
          ${{ inputs.fail-below && format('--fail-below {0}', inputs.fail-below) || '' }} \
          > maddox-report.md 2> maddox-scan.log
        SCAN_EXIT=$?
        set -e

        cat maddox-scan.log >&2
        echo "exit_code=$SCAN_EXIT" >> "$GITHUB_OUTPUT"

        EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
        echo "comment_body<<$EOF" >> "$GITHUB_OUTPUT"
        cat maddox-report.md >> "$GITHUB_OUTPUT"
        echo "$EOF" >> "$GITHUB_OUTPUT"

    - name: Post or update PR comment
      if: github.event.pull_request.number
      uses: actions/github-script@v7
      env:
        MADDOX_COMMENT_BODY: ${{ steps.run-scan.outputs.comment_body }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const { owner, repo, number } = context.issue;
          if (!number) return;

          const body = process.env.MADDOX_COMMENT_BODY;
          if (!body) {
            core.warning('Maddox: comment body is empty, skipping PR comment.');
            return;
          }

          const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: number, per_page: 100 });
          const existing = comments.find(c => c.body && c.body.includes('maddox-engine-drift-report'));

          if (existing) {
            await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
          } else {
            await github.rest.issues.createComment({ owner, repo, issue_number: number, body });
          }

    - name: Enforce drift threshold
      if: inputs.fail-below != ''
      shell: bash
      run: |
        if [ "${{ steps.run-scan.outputs.exit_code }}" != "0" ]; then
          echo "::error::Maddox: drift health score fell below --fail-below ${{ inputs.fail-below }}. See the scan output above or the PR comment for details."
          exit 1
        fi
