name: Drift Check

on:
  pull_request:

jobs:
  maddox:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          target-dir: example
          theme-css: example/theme.css
          github-token: ${{ secrets.GITHUB_TOKEN }}
